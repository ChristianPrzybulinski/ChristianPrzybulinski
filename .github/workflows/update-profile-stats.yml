name: Update profile stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh cards
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 scripts/update_profile_stats.py
      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-commits.svg assets/github-prs.svg assets/github-projects.svg
          git diff --cached --quiet || git commit -m "chore(stats): refresh profile activity cards"
          git push
